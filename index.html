<script>// Transportlaag. Interface: connect(pairing), disconnect(), send(msg), onMessage(cb), onStatus(cb)
// status: 'disconnected' | 'connecting' | 'connected'. Vervang deze klasse door WebSocket/TURN-variant met dezelfde vorm.
class PeerTransport {
  constructor(opts) { this.opts = opts || {}; this.msgCb = () => {}; this.stCb = () => {}; this.attempt = 0; this.timer = null; this.stopped = true; this.ok = false; }
  onMessage(cb) { this.msgCb = cb; }
  onStatus(cb) { this.stCb = cb; }
  connect(pairing) { this.pairing = pairing; this.stopped = false; this.attempt = 0; this._open(); }
  disconnect() { this.stopped = true; clearTimeout(this.timer); this.timer = null; this._close(); this.stCb('disconnected'); }
  send(msg) { if (this.ok && this.conn && this.conn.open) try { this.conn.send(msg); } catch (e) { /* ignore */ } }
  _close() { const c = this.conn, p = this.peer; this.conn = this.peer = null; this.ok = false; try { c && c.close(); } catch (e) {} try { p && p.destroy(); } catch (e) {} }
  _retry() {
    if (this.stopped || this.timer) return;
    const d = Math.min(30000, 1000 * 2 ** this.attempt++); // exponentiële backoff
    this.timer = setTimeout(() => { this.timer = null; this._open(); }, d);
    this._close(); this.stCb('connecting');
  }
  _open() {
    this._close(); this.stCb('connecting');
    const p = (this.peer = new Peer(undefined, this.opts));
    p.on('open', () => {
      if (this.peer !== p) return;
      const c = (this.conn = p.connect(this.pairing.peer, { reliable: true }));
      c.on('open', () => c.send({ t: 'hello', token: this.pairing.token, dev: this.pairing.dev, v: 1 }));
      c.on('data', (m) => { if (this.conn !== c) return; if (m && m.t === 'hello_ok') { this.ok = true; this.attempt = 0; this.stCb('connected'); } else this.msgCb(m); });
      c.on('close', () => { if (this.conn === c) this._retry(); });
      c.on('error', () => { if (this.conn === c) this._retry(); });
    });
    p.on('error', () => { if (this.peer === p) this._retry(); });
    p.on('disconnected', () => { if (this.peer === p && !(this.conn && this.conn.open)) this._retry(); });
  }
}
</script>
<script>(() => {
  const $ = (s) => document.querySelector(s), LS = localStorage;
  const CFG = { peer: { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' } /* TURN hier toevoegen */] } }, staleMs: 2500, delayMs: 250 };
  LS.dev = LS.dev || (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());

  // ---------- pairing ----------
  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    if (h.get('peer') && h.get('token')) { LS.peer = h.get('peer'); LS.token = h.get('token'); history.replaceState(null, '', location.pathname + location.search); return true; }
    return false;
  }
  const tr = new PeerTransport(CFG.peer);
  let conn = 'disconnected', lastRx = 0;
  function go() { tr.disconnect(); if (LS.peer && LS.token) tr.connect({ peer: LS.peer, token: LS.token, dev: LS.dev }); paint(); }
  tr.onStatus((s) => { conn = s; if (s === 'connected') lastRx = performance.now(); paint(); });
  tr.onMessage((m) => { lastRx = performance.now(); if (m && m.t === 'state') pushState(m); });
  setInterval(() => tr.send({ t: 'ping', ts: Date.now() }), 2000);

  function paint() {
    const stale = conn === 'connected' && performance.now() - lastRx > CFG.staleMs;
    const [c, t] = !LS.peer ? ['', 'Niet gekoppeld'] : conn === 'connected' ? (stale ? ['warn', 'Data verouderd'] : ['ok', 'Verbonden']) : conn === 'connecting' ? ['warn', 'Verbinden…'] : ['bad', 'Verbroken'];
    $('#dot').className = c; $('#stxt').textContent = t;
    document.body.classList.toggle('stale', stale || (!!LS.peer && conn !== 'connected'));
  }
  setInterval(paint, 500);

  const dlg = $('#pair');
  $('#gear').onclick = () => { $('#ipeer').value = LS.peer || ''; $('#itoken').value = LS.token || ''; $('#wlnote').hidden = 'wakeLock' in navigator; dlg.showModal(); };
  $('#save').onclick = () => { LS.peer = $('#ipeer').value.trim(); LS.token = $('#itoken').value.trim(); go(); };
  $('#unpair').onclick = () => { delete LS.peer; delete LS.token; go(); };
  addEventListener('hashchange', () => { if (readHash()) go(); });

  // ---------- tabs ----------
  let tab = 'map';
  document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('.tab').forEach((s) => s.classList.toggle('on', s.id === tab));
    if (tab === 'map') map.invalidateSize();
  });

  // ---------- state-buffer + interpolatie ----------
  const buf = []; let off = null;
  const Lr = (a, b, k) => a + (b - a) * k, An = (a, b, k) => a + ((((b - a) % 360) + 540) % 360 - 180) * k;
  function lerpState(a, b, k) {
    return { lat: Lr(a.lat, b.lat, k), lon: Lr(a.lon, b.lon, k), alt: Lr(a.alt, b.alt, k), ias: Lr(a.ias, b.ias, k), gs: Lr(a.gs, b.gs, k),
      vs: Lr(a.vs, b.vs, k), pitch: Lr(a.pitch, b.pitch, k), hdg: An(a.hdg, b.hdg, k), roll: An(a.roll, b.roll, k), ap: b.ap, hold: b.hold };
  }
  function pushState(m) {
    if (buf.length && m.ts <= buf[buf.length - 1].ts) return;
    const o = Date.now() - m.ts; // klokverschil + latency; neem het minimum (traag bijgesteld) als offset
    off = off === null ? o : o < off ? o : off + (o - off) * 0.02;
    buf.push(m); if (buf.length > 40) buf.shift();
    addTrail(m);
  }
  function sample() {
    if (!buf.length) return null;
    const rt = Date.now() - off - CFG.delayMs;
    for (let i = buf.length - 1; i > 0; i--) {
      const a = buf[i - 1], b = buf[i];
      if (rt >= a.ts) return rt >= b.ts ? b : lerpState(a, b, (rt - a.ts) / (b.ts - a.ts));
    }
    return buf[0];
  }

  // ---------- kaart ----------
  const map = L.map('lmap', { zoomControl: false }).setView([52.1, 4.3], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
  const icon = L.divIcon({ className: 'ac', iconSize: [36, 36], iconAnchor: [18, 18],
    html: '<svg viewBox="0 0 24 24" width="36" height="36"><path d="M12 2l2 8 8 4v2l-8-2v5l3 2v1l-5-1-5 1v-1l3-2v-5l-8 2v-2l8-4z" fill="#ffd400" stroke="#000" stroke-width=".8"/></svg>' });
  const mk = L.marker([0, 0], { icon, interactive: false }); let placed = false;
  const trail = L.polyline([], { color: '#00e5ff', weight: 3 }).addTo(map), pts = [];
  let follow = true;
  const setFollow = (f) => { follow = f; const b = $('#follow'); b.classList.toggle('on', f); b.textContent = 'Volg vliegtuig: ' + (f ? 'aan' : 'uit'); };
  $('#follow').onclick = () => setFollow(!follow);
  map.on('dragstart', () => setFollow(false));
  function addTrail(m) {
    const l = pts[pts.length - 1];
    if (l && Math.hypot((m.lat - l[0]) * 111000, (m.lon - l[1]) * 111000 * Math.cos(m.lat * Math.PI / 180)) < 15) return;
    pts.push([m.lat, m.lon]); if (pts.length > 5000) pts.shift(); trail.setLatLngs(pts);
  }
  function drawMap(s) {
    const ll = [s.lat, s.lon];
    if (!placed) { mk.addTo(map); map.setView(ll, 11); placed = true; }
    mk.setLatLng(ll);
    const el = mk.getElement(); if (el && el.firstChild) el.firstChild.style.transform = 'rotate(' + s.hdg + 'deg)';
    if (follow) map.panTo(ll, { animate: false });
    const f = (n, w) => String(Math.round(n)).padStart(w, ' ');
    $('#data').textContent = `GS  ${f(s.gs, 4)} kt   IAS ${f(s.ias, 4)} kt\nALT ${f(s.alt, 5)} ft   HDG ${String(Math.round((s.hdg + 360) % 360)).padStart(3, '0')}°\nVS  ${s.vs >= 0 ? '+' : ''}${Math.round(s.vs)} fpm`;
  }

  // ---------- PFD (SVG) ----------
  const svg = $('#pfdsvg'), CX = 360, CY = 200, PPD = 7;
  let ladder = '';
  for (let p = -40; p <= 40; p += 5) {
    if (!p) continue; const y = -p * PPD, w = p % 10 ? 28 : 56;
    ladder += `<line x1="${-w}" x2="${w}" y1="${y}" y2="${y}" stroke="#fff" stroke-width="2"/>` + (p % 10 ? '' : `<text x="${w + 8}" y="${y + 5}" fill="#fff" font-size="14">${Math.abs(p)}</text><text x="${-w - 8}" y="${y + 5}" fill="#fff" font-size="14" text-anchor="end">${Math.abs(p)}</text>`);
  }
  let rollTicks = '';
  for (const a of [-60, -45, -30, -20, -10, 0, 10, 20, 30, 45, 60]) rollTicks += `<line x1="0" x2="0" y1="-150" y2="${-150 + (a % 30 === 0 ? 18 : 10)}" stroke="#fff" stroke-width="2.5" transform="rotate(${a})"/>`;
  svg.innerHTML = `<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14508f"/><stop offset="1" stop-color="#58a6e8"/></linearGradient>
<linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a2b"/><stop offset="1" stop-color="#3d2711"/></linearGradient></defs>
<g id="hz"><rect x="-1200" y="-1500" width="2400" height="1500" fill="url(#sky)"/><rect x="-1200" y="0" width="2400" height="1500" fill="url(#gnd)"/>
<line x1="-1200" x2="1200" stroke="#fff" stroke-width="3"/>${ladder}</g>
<g transform="translate(${CX},${CY})"><g id="rl">${rollTicks}<path d="M0 -150 l-7 -13 h14z" fill="#fff"/></g><path d="M0 -150 l-9 14 h18z" fill="#ffd400" transform="translate(0,-2)"/></g>
<path d="M${CX - 100} ${CY}h70l30 20 30-20h70" fill="none" stroke="#ffd400" stroke-width="5" stroke-linejoin="round"/><circle cx="${CX}" cy="${CY}" r="4" fill="#ffd400"/>
<rect x="10" y="60" width="100" height="280" fill="rgba(0,0,0,.5)"/><g id="st" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#fff"></g>
<rect x="610" y="60" width="100" height="280" fill="rgba(0,0,0,.5)"/><g id="at" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#fff"></g>
<path d="M110 200 l-14 -9 v18z" fill="#ffd400"/><rect x="26" y="183" width="70" height="34" fill="#000" stroke="#ffd400" stroke-width="2"/><text id="sv" x="92" y="208" fill="#fff" font-size="22" font-weight="700" text-anchor="end" font-family="ui-monospace,Menlo,monospace"></text>
<path d="M610 200 l14 -9 v18z" fill="#ffd400"/><rect x="624" y="183" width="84" height="34" fill="#000" stroke="#ffd400" stroke-width="2"/><text id="av" x="702" y="208" fill="#fff" font-size="22" font-weight="700" text-anchor="end" font-family="ui-monospace,Menlo,monospace"></text>
<rect x="722" y="60" width="68" height="280" fill="rgba(0,0,0,.5)"/><g stroke="#fff" stroke-width="2" font-size="12" fill="#fff" font-family="ui-monospace,Menlo,monospace">
${[-2, -1, 0, 1, 2].map((k) => `<line x1="722" x2="${k ? 736 : 742}" y1="${200 - k * 60}" y2="${200 - k * 60}"/>${k ? `<text x="744" y="${204 - k * 60}" stroke="none">${Math.abs(k)}</text>` : ''}`).join('')}</g>
<path id="vn" d="M790 200 L752 200" stroke="#0f0" stroke-width="4"/><text id="vt" x="756" y="352" fill="#0f0" font-size="15" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"></text>
<rect x="160" y="352" width="400" height="40" fill="rgba(0,0,0,.55)"/><g id="ht" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#fff"></g>
<path d="M${CX} 352 l-8 -12 h16z" fill="#ffd400"/><rect x="${CX - 30}" y="318" width="60" height="22" fill="#000" stroke="#ffd400" stroke-width="2"/><text id="hv" x="${CX}" y="335" fill="#fff" font-size="16" font-weight="700" text-anchor="middle" font-family="ui-monospace,Menlo,monospace"></text>`;
  const g = (id) => svg.querySelector('#' + id);
  const hz = g('hz'), rl = g('rl'), st = g('st'), at = g('at'), ht = g('ht'), sv = g('sv'), av = g('av'), vn = g('vn'), vt = g('vt'), hv = g('hv');
  // Verticale tape: ticks aan 'edge', richting dir (-1 links, +1 rechts)
  function vtape(v, ppu, step, lab, edge, dir, min) {
    let s = ''; const half = 140 / ppu;
    for (let t = Math.ceil((v - half) / step) * step; t <= v + half; t += step) {
      if (min !== undefined && t < min) continue;
      const y = CY - (t - v) * ppu, major = t % lab === 0;
      s += `<line x1="${edge}" x2="${edge + dir * (major ? 16 : 8)}" y1="${y}" y2="${y}" stroke="#fff" stroke-width="2"/>`;
      if (major) s += `<text x="${edge + dir * 22}" y="${y + 5}" text-anchor="${dir < 0 ? 'end' : 'start'}">${t}</text>`;
    }
    return s;
  }
  function drawPFD(s) {
    hz.setAttribute('transform', `translate(${CX},${CY}) rotate(${-s.roll}) translate(0,${s.pitch * PPD})`);
    rl.setAttribute('transform', `rotate(${-s.roll})`);
    st.innerHTML = vtape(s.ias, 3.5, 5, 10, 110, -1, 0);
    at.innerHTML = vtape(s.alt, 0.6, 20, 100, 610, 1);
    sv.textContent = Math.round(s.ias); av.textContent = Math.round(s.alt);
    const h = (s.hdg + 360) % 360; let x = '';
    for (let t = Math.ceil((h - 50) / 5) * 5; t <= h + 50; t += 5) {
      const px = CX + (t - h) * 4, tt = ((t % 360) + 360) % 360, major = tt % 10 === 0;
      x += `<line x1="${px}" x2="${px}" y1="352" y2="${352 + (major ? 12 : 6)}" stroke="#fff" stroke-width="2"/>`;
      if (major) x += `<text x="${px}" y="381" text-anchor="middle">${{ 0: 'N', 90: 'E', 180: 'S', 270: 'W' }[tt] || String(tt / 10).padStart(2, '0')}</text>`;
    }
    ht.innerHTML = x; hv.textContent = String(Math.round(h) % 360).padStart(3, '0');
    const vs = Math.max(-2000, Math.min(2000, s.vs));
    vn.setAttribute('d', `M790 ${200 - vs * 0.06} L752 ${200 - vs * 0.06}`); vt.textContent = (s.vs >= 0 ? '+' : '') + Math.round(s.vs);
  }

  // ---------- render-lus ----------
  let lastMap = 0;
  (function frame(now) {
    const s = sample();
    if (s) { if (tab === 'pfd') drawPFD(s); else if (tab === 'map' && now - lastMap > 100) { lastMap = now; drawMap(s); } }
    requestAnimationFrame(frame);
  })(0);

  // ---------- Wake Lock ----------
  let wl = null;
  async function lock() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && (!wl || wl.released)) wl = await navigator.wakeLock.request('screen'); } catch (e) { /* geweigerd */ } }
  document.addEventListener('visibilitychange', lock); document.addEventListener('click', lock); lock();

  // (geen service worker in de single-file versie)
  readHash(); go();
  if (!LS.peer) $('#gear').click();
})();
</script>
</body></html>
