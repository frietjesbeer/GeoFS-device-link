<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>:root{--bg:#0a0e14;--fg:#e6edf3;--ok:#3ddc84;--warn:#ffb020;--bad:#ff4d4d;--acc:#00e5ff;--mag:#ff4dff;--panel:#111823;--line:#2c3b52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:space-between;align-items:center;height:46px;padding:0 8px;background:var(--panel);border-bottom:1px solid #243044;gap:8px}
nav{display:flex;gap:4px}
button{font:inherit;color:var(--fg);background:#1b2636;border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 14px}
button:disabled{opacity:.45}
nav button.on,#follow.on,#names.on{background:#0d4a57;border-color:var(--acc);color:#fff}
#status{display:flex;align-items:center;gap:8px;white-space:nowrap}
#dot{width:12px;height:12px;border-radius:50%;background:#555}
#dot.ok{background:var(--ok)}#dot.warn{background:var(--warn)}#dot.bad{background:var(--bad)}
#gear{padding:0 10px}
main{flex:1;position:relative;min-height:0}
.tab{position:absolute;inset:0;display:none}.tab.on{display:block}

/* kaart */
#lmap{position:absolute;inset:0;background:#0a0e14}
#data{position:absolute;left:8px;top:8px;z-index:500;background:rgba(10,14,20,.8);padding:6px 10px;border-radius:8px;font:600 15px ui-monospace,Menlo,monospace;white-space:pre;line-height:1.45}
#mapbtns{position:absolute;right:8px;bottom:26px;z-index:500;display:flex;gap:6px}
.acw{width:44px;height:44px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.75))}
.acw svg{display:block;width:44px;height:44px}

/* PFD */
#pfdsvg{width:100%;height:100%;display:block;background:#000}
#fsbtn{position:absolute;right:8px;top:8px;z-index:5;min-width:44px;min-height:44px;font-size:20px;padding:0;background:rgba(10,14,20,.55);border-color:rgba(255,255,255,.25)}
body.pfdfs header{display:none}
body.pfdfs #pfd{position:fixed;inset:0;z-index:900;background:#000;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body.pfdfs{padding:0}

/* autopilot */
#ap{overflow:auto;-webkit-overflow-scrolling:touch}
#apwrap{display:flex;gap:8px;padding:8px;min-height:100%}
#apside{flex:0 0 170px;display:flex;flex-direction:column;gap:8px}
#aptog{min-height:84px;font-size:17px;font-weight:700;letter-spacing:.5px;border-radius:12px}
#aptog.on{background:#0f5a32;border-color:var(--ok);color:#fff}
#aptog.off{background:#2a3342}
#apmsg{min-height:44px;font-size:14px;color:#8b98a9;line-height:1.35}
#apmsg.ok{color:var(--ok)}#apmsg.bad{color:var(--bad)}
.soon{margin:auto 0 0;color:#8b98a9;font-size:13px}
#apgrid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:8px;align-content:start}
.apc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.aph{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.apl{font-size:11px;letter-spacing:1px;color:#8b98a9}
.apv{display:flex;align-items:baseline;gap:5px}
.apv b{font:700 28px ui-monospace,Menlo,monospace;color:var(--mag);line-height:1}
.apv small{color:#8b98a9}
.apr{display:flex;gap:4px;align-items:stretch}
.apr button{flex:1 1 0;min-height:44px;padding:0 2px;font-size:14px}
.apr input{flex:1.7 1 0;min-width:0;margin:0;padding:0 2px;text-align:center;font-weight:700;font-size:16px}
.set{min-height:44px;background:#0d4a57;border-color:var(--acc);font-weight:700}
#ap.dis #apgrid,#ap.dis #aptog{pointer-events:none;opacity:.5}

.soon{padding:0}
.ac svg{transition:none}
body.stale #lmap,body.stale #pfdsvg{filter:grayscale(.85) brightness(.65)}

/* dialoog */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;width:min(420px,92vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:8px 0}
label{display:block;margin:10px 0;font-size:13px;color:#8b98a9}
label.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg)}
label.chk input{width:22px;height:22px;margin:0}
input{display:block;width:100%;margin-top:4px;padding:10px;font:15px ui-monospace,monospace;background:#0a0e14;color:var(--fg);border:1px solid var(--line);border-radius:8px}
.row{display:flex;gap:8px;margin-top:12px}
</style>
<title>GeoFS Companion</title></head>

  <nav><button data-tab="map" class="on">Kaart</button><button data-tab="pfd">Instrumenten</button><button data-tab="ap">Autopilot</button></nav>

  <section id="map" class="tab on">
    <div id="lmap"></div><div id="data">Wachten op data…</div>
    <div id="mapbtns"><button id="names" class="on">Namen: aan</button><button id="follow" class="on">Volg vliegtuig: aan</button></div>
  </section>
  <section id="pfd" class="tab">
    <svg id="pfdsvg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"></svg>

  </section>
  <section id="ap" class="tab">

<script>// Transportlaag. Interface: connect(pairing), disconnect(), send(msg), onMessage(cb), onStatus(cb)
// status: 'disconnected' | 'connecting' | 'connected'. Vervang deze klasse door WebSocket/TURN-variant met dezelfde vorm.
class PeerTransport {
  constructor(opts) { this.opts = opts || {}; this.msgCb = () => {}; this.stCb = () => {}; this.attempt = 0; this.timer = null; this.stopped = true; this.ok = false; }
  onMessage(cb) { this.msgCb = cb; }
  onStatus(cb) { this.stCb = cb; }
  connect(pairing) { this.pairing = pairing; this.stopped = false; this.attempt = 0; this._open(); }
  disconnect() { this.stopped = true; clearTimeout(this.timer); this.timer = null; this._close(); this.stCb('disconnected'); }
  send(msg) { if (this.ok && this.conn && this.conn.open) try { this.conn.send(msg); } catch (e) { /* ignore */ } }
  _close() { const c = this.conn, p = this.peer; this.conn = this.peer = null; this.ok = false; try { c && c.close(); } catch (e) {} try { p && p.destroy(); } catch (e) {} }
  _retry() {
    if (this.stopped || this.timer) return;
    const d = Math.min(30000, 1000 * 2 ** this.attempt++); // exponentiële backoff
    this.timer = setTimeout(() => { this.timer = null; this._open(); }, d);
    this._close(); this.stCb('connecting');
  }
  _open() {
    this._close(); this.stCb('connecting');
    const p = (this.peer = new Peer(undefined, this.opts));
    p.on('open', () => {
      if (this.peer !== p) return;
      const c = (this.conn = p.connect(this.pairing.peer, { reliable: true }));
      c.on('open', () => c.send({ t: 'hello', token: this.pairing.token, dev: this.pairing.dev, v: 1 }));
      c.on('data', (m) => { if (this.conn !== c) return; if (m && m.t === 'hello_ok') { this.ok = true; this.attempt = 0; this.stCb('connected'); } else this.msgCb(m); });
      c.on('close', () => { if (this.conn === c) this._retry(); });
      c.on('error', () => { if (this.conn === c) this._retry(); });
    });
    p.on('error', () => { if (this.peer === p) this._retry(); });
    p.on('disconnected', () => { if (this.peer === p && !(this.conn && this.conn.open)) this._retry(); });
  }
}

    if (ap.hdg != null) { const d = ((ap.hdg - h + 540) % 360) - 180, px = CX + Math.max(-58, Math.min(58, d)) * 4; hb.innerHTML = `<path d="M${px - 8} 342h16l-8 14z" fill="${MAG}" fill-opacity="${dim}"/>`; } else hb.innerHTML = '';
    // vertical speed
    const vs = Math.max(-2000, Math.min(2000, s.vs));
    vn.setAttribute('d', `M792 190L752 ${190 - vs * 0.06}`); vt.textContent = (s.vs >= 0 ? '+' : '') + Math.round(s.vs);
  }
  drawPFD({ ias: 0, gs: 0, alt: 0, hdg: 0, pitch: 0, roll: 0, vs: 0, ap: {} }, 0);

  // ---------- PFD volledig scherm (met pseudo-fullscreen voor iPhone Safari) ----------
  const fsb = $('#fsbtn'), isNativeFs = () => document.fullscreenElement || document.webkitFullscreenElement;
  function setFs(on) {
    document.body.classList.toggle('pfdfs', on); fsb.textContent = on ? '✕' : '⛶';
    try {
      const el = $('#pfd');
      if (on) {
        const rq = el.requestFullscreen || el.webkitRequestFullscreen;
        if (rq && !isNativeFs()) { const p = rq.call(el); if (p && p.catch) p.catch(() => {}); }
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
      } else {
        if (isNativeFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      }
    } catch (e) { /* de CSS-variant (pseudo-fullscreen) blijft werken */ }
  }
  fsb.onclick = () => setFs(!document.body.classList.contains('pfdfs'));
  const onFsChange = () => { if (!isNativeFs() && document.body.classList.contains('pfdfs')) setFs(false); };
  document.addEventListener('fullscreenchange', onFsChange); document.addEventListener('webkitfullscreenchange', onFsChange);

  // ---------- autopilot-tab ----------
  const APC = [
    { k: 'hdg', name: 'HEADING', short: 'heading', unit: '°', cmd: 'set_hdg', steps: [-10, -1, 1, 10], min: 0, max: 359, wrap: true, fmt: (v) => String(Math.round(v) % 360).padStart(3, '0') },
    { k: 'alt', name: 'HOOGTE', short: 'hoogte', unit: 'ft', cmd: 'set_alt', steps: [-1000, -100, 100, 1000], min: 0, max: 60000, fmt: (v) => Math.round(v) },
    { k: 'spd', name: 'SNELHEID (IAS)', short: 'snelheid', unit: 'kt', cmd: 'set_spd', steps: [-10, -1, 1, 10], min: 60, max: 700, fmt: (v) => Math.round(v) },
    { k: 'vs', name: 'VERTICALE SNELHEID', short: 'VS', unit: 'fpm', cmd: 'set_vs', steps: [-500, -100, 100, 500], min: -6000, max: 6000, fmt: (v) => (v > 0 ? '+' : '') + Math.round(v) },
  ];
  const sgnTxt = (d) => (d > 0 ? '+' : '−') + Math.abs(d);
  const apGrid = $('#apgrid'), dirty = {};
  apGrid.innerHTML = APC.map((c) => `<div class="apc"><div class="aph"><span class="apl">${c.name}</span><span class="apv"><b id="v-${c.k}">—</b><small>${c.unit}</small></span></div>
<div class="apr">${c.steps.slice(0, 2).map((d) => `<button data-k="${c.k}" data-d="${d}">${sgnTxt(d)}</button>`).join('')}<input id="i-${c.k}" data-k="${c.k}" type="number" inputmode="numeric" step="1">${c.steps.slice(2).map((d) => `<button data-k="${c.k}" data-d="${d}">${sgnTxt(d)}</button>`).join('')}</div>
<button class="set" data-k="${c.k}" data-set="1">Zet ${c.short}</button></div>`).join('');
  const apOf = (c) => (latestState() && latestState().ap && latestState().ap[c.k]);
  function latestState() { return buf.length ? buf[buf.length - 1] : null; }
  const norm = (c, v) => (c.wrap ? ((Math.round(v) % 360) + 360) % 360 : Math.min(c.max, Math.max(c.min, Math.round(v))));

  let cid = 0, msgT = null; const pend = new Map();
  function say(txt, cls) {
    const el = $('#apmsg'); el.textContent = txt; el.className = cls || '';
    clearTimeout(msgT); msgT = setTimeout(() => { el.textContent = ''; el.className = ''; }, 7000);
  }
  function sendCmd(name, value, label, k) {
    if (!canSend()) { say('Niet verbonden: commando niet verstuurd', 'bad'); return; }
    const id = ++cid; pend.set(id, { name, label, k, t: performance.now() });
    tr.send({ t: 'cmd', id, name, value }); say(label + '…', '');
  }
  function onAck(m) {
    const p = pend.get(m.id); if (!p) return; pend.delete(m.id);
    if (m.ok) { say('✔ ' + p.label + (m.applied != null && typeof m.applied !== 'boolean' ? ' → ' + m.applied : ''), 'ok'); if (p.k) dirty[p.k] = false; }
    else say('✖ ' + p.label + ': ' + (m.err || 'fout'), 'bad');
  }
  setInterval(() => { const n = performance.now(); pend.forEach((p, id) => { if (n - p.t > CFG.ackMs) { pend.delete(id); say(p.label + ': geen antwoord van de sim', 'bad'); } }); }, 500);

  apGrid.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const c = APC.find((x) => x.k === b.dataset.k), inp = $('#i-' + c.k);
    if (b.dataset.set) {
      const v = parseFloat(inp.value); if (!isFinite(v)) { say('Vul eerst een getal in', 'bad'); return; }
      const val = norm(c, v); inp.value = val; sendCmd(c.cmd, val, c.short + ' ' + val, c.k);
    } else {
      let base = parseFloat(inp.value); if (!isFinite(base)) base = Number(apOf(c)) || 0;
      inp.value = norm(c, base + Number(b.dataset.d)); dirty[c.k] = true;
    }
  });
  apGrid.addEventListener('input', (e) => { if (e.target.dataset.k) dirty[e.target.dataset.k] = true; });
  $('#aptog').onclick = () => { const s = latestState(), on = !!(s && s.ap && s.ap.on); sendCmd('ap_toggle', !on, 'autopilot ' + (on ? 'uit' : 'aan')); };

  function updateAp(s) {
    const a = (s && s.ap) || {}, ok = !!s && canSend();
    $('#ap').classList.toggle('dis', !ok);
    $('#ap').querySelectorAll('button,input').forEach((el) => { el.disabled = !ok; });
    const t = $('#aptog'); t.textContent = 'AUTOPILOT: ' + (a.on === true ? 'AAN' : a.on === false ? 'UIT' : '—'); t.className = a.on === true ? 'on' : 'off';
    // Toon altijd wat de sim echt heeft; het invoerveld volgt de sim zolang je niets aan het instellen bent
    for (const c of APC) {
      const v = a[c.k], inp = $('#i-' + c.k);
      $('#v-' + c.k).textContent = v == null ? '—' : c.fmt(v);
      if (!dirty[c.k] && document.activeElement !== inp && v != null) inp.value = Math.round(v);
    }
  }

  // ---------- render-lus ----------
  let lastMap = 0, lastAp = 0;
  (function frame(now) {
    const s = sample();
    if (tab === 'pfd') { if (s) drawPFD(s, now); }
    else if (tab === 'map') { if (s && now - lastMap > 100) { lastMap = now; drawMap(s); } }
    else if (tab === 'ap' && now - lastAp > 200) { lastAp = now; updateAp(latestState()); }
    requestAnimationFrame(frame);
  })(0);

  // ---------- Wake Lock ----------
  let wl = null;
  async function lock() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && (!wl || wl.released)) wl = await navigator.wakeLock.request('screen'); } catch (e) { /* geweigerd */ } }
  document.addEventListener('visibilitychange', lock); document.addEventListener('click', lock); lock();

  // (geen service worker in de single-file versie)
  readHash(); go();
  if (!LS.peer) $('#gear').click();
})();
</script>
</body></html>
